  patcher-enabled: "&bPatcher Paradise &ais active for &e%window% seconds&a!"
  patcher-resistance-activated: "&bPatcher Paradise &aactivated! &e%effect% %level% &7for &e%duration% seconds&a!"
  rush-speed-activated: "&eSwingers Rush &aactivated! &fSpeed %level% &7for &e%duration% seconds&a!"
  reloaded: "&aParadise Buffs configuration successfully reloaded!"
