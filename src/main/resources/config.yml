  prefix: "&8[&6&lPARADISE&f&lPVP&8] &7» "
  no-permission: "&cYou do not have permission to do that!"
  players-only: "&cOnly players can open the Paradise Buff shop!"
  usage: "&cUsage: /paradisebuffs [shop|give <buff> [player] [amount]|list|reload]"
  shop-disabled: "&cThe Paradise Buff shop is disabled. Use &e/coins &cto purchase buffs!"
  shop-unavailable: "&cThat Paradise Buff is currently unavailable!"
  not-enough-currency: "&cYou need &e%price% %currency% &cto purchase that!"
  mobcoins-unavailable: "&cMobCoins are currently unavailable. Please contact an administrator!"
  mobcoins-transaction-failed: "&cYour MobCoins could not be safely charged, so nothing was purchased!"
  purchased: "&aYou purchased &e%amount%x %buff% &afor &e%price% %currency%&a!"
  buff-list: "&aAvailable Paradise Buffs: &b%buffs%"
  buff-not-found: "&cUnknown or disabled Paradise Buff: &f%buff%&c. Use &e/pb list&c."
  none: "&cnone"
