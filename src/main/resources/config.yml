  given: "&aGave &e%amount%x %buff% &aorb(s) to &e%player%&a!"
  received: "&aYou received &e%amount%x %buff% &aorb(s)!"
  applied: "&aYou successfully applied %buff% &ato your armor!"
  wrong-item: "&cThis buff orb can only be applied to a &e%item%&c!"
  orb-cannot-place: "&cParadise Buff orbs cannot be placed as blocks!"
